services:
  auth:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./services/auth/src:/app/services/auth/src
      - ./services/auth/migrations:/app/services/auth/migrations
      - ./packages/shared/src:/app/packages/shared/src

  utils:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./services/utils/src:/app/services/utils/src
      - ./packages/shared/src:/app/packages/shared/src

  notification:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./services/notification/src:/app/services/notification/src
      - ./services/notification/migrations:/app/services/notification/migrations
      - ./packages/shared/src:/app/packages/shared/src

  user:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./services/user/src:/app/services/user/src
      - ./services/user/migrations:/app/services/user/migrations
      - ./packages/shared/src:/app/packages/shared/src

  job:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./services/job/src:/app/services/job/src
      - ./services/job/migrations:/app/services/job/migrations
      - ./packages/shared/src:/app/packages/shared/src

  application:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./services/application/src:/app/services/application/src
      - ./services/application/migrations:/app/services/application/migrations
      - ./packages/shared/src:/app/packages/shared/src

  gateway:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./services/gateway/src:/app/services/gateway/src
      - ./packages/shared/src:/app/packages/shared/src

  web:
    build:
      target: development
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8080}
    environment:
      NODE_ENV: development
      PORT: 3000
      GATEWAY_SERVER_URL: http://gateway:8080
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/next.config.mjs:/app/apps/web/next.config.mjs
      - ./apps/web/tailwind.config.ts:/app/apps/web/tailwind.config.ts
      - ./apps/web/postcss.config.mjs:/app/apps/web/postcss.config.mjs
      - web-next:/app/apps/web/.next

volumes:
  web-next:
