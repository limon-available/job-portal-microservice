name: hireheaven

x-service-env: &service-env
  NODE_ENV: production
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  REDIS_URL: redis://redis:6379
  KAFKA_BROKER: kafka:9092
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Copy .env.example to .env and set INTERNAL_API_KEY}
  GATEWAY_INTERNAL_KEY: ${GATEWAY_INTERNAL_KEY:?Copy .env.example to .env and set GATEWAY_INTERNAL_KEY}

x-app-healthcheck: &app-healthcheck
  test:
    - CMD
    - node
    - -e
    - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
  interval: 20s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [hireheaven]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [hireheaven]
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    volumes:
      - ./docker/kafka/init-topics.sh:/scripts/init-topics.sh:ro
    networks: [hireheaven]
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file: ./services/auth/.env
    environment:
      <<: *service-env
      PORT: 5000
      UPLOAD_SERVICE: http://utils:5001
    expose: ["5000"]
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      utils:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [hireheaven]
    init: true
    restart: unless-stopped

  utils:
    build:
      context: .
      dockerfile: services/utils/Dockerfile
    env_file: ./services/utils/.env
    environment:
      <<: *service-env
      PORT: 5001
    dns:
      - 8.8.8.8
      - 1.1.1.1
    expose: ["5001"]
    healthcheck: *app-healthcheck
    networks: [hireheaven]
    init: true
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    env_file: ./services/notification/.env
    environment:
      <<: *service-env
      PORT: 5005
    expose: ["5005"]
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [hireheaven]
    init: true
    restart: unless-stopped

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    env_file: ./services/user/.env
    environment:
      <<: *service-env
      PORT: 5002
      UPLOAD_SERVICE: http://utils:5001
    expose: ["5002"]
    depends_on:
      utils:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [hireheaven]
    init: true
    restart: unless-stopped

  job:
    build:
      context: .
      dockerfile: services/job/Dockerfile
    env_file: ./services/job/.env
    environment:
      <<: *service-env
      PORT: 5003
      UPLOAD_SERVICE: http://utils:5001
    expose: ["5003"]
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      utils:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [hireheaven]
    init: true
    restart: unless-stopped

  application:
    build:
      context: .
      dockerfile: services/application/Dockerfile
    env_file: ./services/application/.env
    environment:
      <<: *service-env
      PORT: 5004
      JOB_SERVICE_URL: http://job:5003
      AUTH_SERVICE_URL: http://auth:5000
    expose: ["5004"]
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      job:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [hireheaven]
    init: true
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: ./services/gateway/.env
    environment:
      <<: *service-env
      PORT: 8080
      AUTH_SERVICE_URL: http://auth:5000
      USER_SERVICE_URL: http://user:5002
      JOB_SERVICE_URL: http://job:5003
      APPLICATION_SERVICE_URL: http://application:5004
      NOTIFICATION_SERVICE_URL: http://notification:5005
      UTILS_SERVICE_URL: http://utils:5001
    ports:
      - "8080:8080"
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      job:
        condition: service_healthy
      application:
        condition: service_healthy
      notification:
        condition: service_healthy
      utils:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [hireheaven]
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8080}
    env_file: ./apps/web/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      GATEWAY_SERVER_URL: http://gateway:8080
    ports:
      - "3000:3000"
    expose: ["3000"]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [hireheaven]
    init: true
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:

networks:
  hireheaven:
    driver: bridge
